<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Éditeur d’herbe</title>
  <style>
    :root { color-scheme: dark; font: 15px system-ui, sans-serif; color: #eef3e8; background: #172019; }
    * { box-sizing: border-box; }
    body { max-width: 1100px; margin: auto; padding: 24px; }
    h1 { margin: 0 0 6px; }
    p { color: #b8c7b3; }
    main { display: grid; grid-template-columns: minmax(320px, 1fr) minmax(280px, 0.9fr); gap: 20px; margin-top: 20px; }
    section { padding: 18px; border: 1px solid #40513e; border-radius: 12px; background: #202b21; }
    .editor { display: grid; grid-template-columns: repeat(16, 22px); width: max-content; image-rendering: pixelated; touch-action: none; }
    .pixel { width: 22px; height: 22px; border: 1px solid #101710; cursor: crosshair; }
    .palette { display: flex; flex-wrap: wrap; gap: 8px; margin: 16px 0; }
    .swatch { width: 36px; height: 36px; border: 2px solid #70806b; border-radius: 6px; cursor: pointer; }
    .swatch[aria-pressed="true"] { outline: 2px solid white; outline-offset: 2px; }
    .transparent { background: repeating-conic-gradient(#aaa 0 25%, #444 0 50%) 0 / 12px 12px; }
    .color-row { display: flex; align-items: center; gap: 8px; margin: 9px 0; color: #cbd5c7; }
    input[type="color"] { width: 42px; height: 34px; padding: 2px; border: 0; background: transparent; }
    label.range { display: grid; grid-template-columns: 130px 1fr 42px; align-items: center; gap: 10px; margin: 14px 0; }
    input[type="range"] { width: 100%; accent-color: #83d34b; }
    #preview { width: 100%; height: 330px; display: block; border-radius: 8px; background: linear-gradient(#8fc3ea, #d8e8ef 60%, #536e3f 60%); }
    .buttons { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 16px; }
    button.action { padding: 10px 14px; color: white; background: #416d32; border: 1px solid #78a85c; border-radius: 7px; cursor: pointer; }
    button.action.secondary { background: #344037; border-color: #59675b; }
    #status { min-height: 1.4em; color: #a8e783; }
    @media (max-width: 760px) { main { grid-template-columns: 1fr; } .editor { grid-template-columns: repeat(16, min(5.2vw, 22px)); } .pixel { width: min(5.2vw, 22px); height: min(5.2vw, 22px); } }
  </style>
</head>
<body>
  <h1>Éditeur d’herbe pixelisée</h1>
  <p>Dessine les pixels du panneau. L’aperçu montre deux panneaux croisés comme dans le jeu.</p>
  <main>
    <section>
      <h2>Texture 16 × 24</h2>
      <div class="palette" id="tools" aria-label="Couleur du pinceau"></div>
      <div class="editor" id="pixel-editor" aria-label="Grille de pixels"></div>
      <div id="color-controls"></div>
      <label class="range"><span>Largeur du panneau</span><input id="panel-width" type="range" min="0.2" max="1.2" step="0.02"><output></output></label>
      <label class="range"><span>Hauteur du panneau</span><input id="panel-height" type="range" min="0.3" max="1.5" step="0.02"><output></output></label>
      <div class="buttons">
        <button class="action" id="save">Enregistrer pour le jeu</button>
        <button class="action secondary" id="reset">Réinitialiser</button>
      </div>
      <p id="status" aria-live="polite"></p>
    </section>
    <section>
      <h2>Aperçu 3D</h2>
      <canvas id="preview"></canvas>
      <label class="range"><span>Rotation</span><input id="rotation" type="range" min="0" max="6.28" step="0.02"><output></output></label>
      <p>La texture enregistrée sera utilisée au prochain chargement de la scène, dans ce navigateur.</p>
    </section>
  </main>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="grass.js"></script>
  <script>
    const WIDTH = 16, HEIGHT = 24;
    const vegetation = window.MinecraftVegetation;
    let preset = vegetation.getPreset();
    let brush = 1;
    let painting = false;
    const editor = document.getElementById('pixel-editor');
    const tools = document.getElementById('tools');
    const colorControls = document.getElementById('color-controls');
    const pixels = [];

    const previewCanvas = document.getElementById('preview');
    const renderer = new THREE.WebGLRenderer({ canvas: previewCanvas, antialias: true, alpha: false });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 1.5));
    const previewScene = new THREE.Scene();
    previewScene.background = new THREE.Color(0x9bc8e6);
    previewScene.add(new THREE.HemisphereLight(0xffffff, 0x526c35, 2));
    const previewCamera = new THREE.PerspectiveCamera(38, 1, 0.1, 50);
    previewCamera.position.set(2.8, 1.8, 3.5);
    previewCamera.lookAt(0, 0.55, 0);
    const ground = new THREE.Mesh(new THREE.PlaneGeometry(20, 20), new THREE.MeshLambertMaterial({ color: 0x668644 }));
    ground.rotation.x = -Math.PI / 2;
    ground.position.y = -0.015;
    previewScene.add(ground);
    const previewPlant = new THREE.Group();
    previewScene.add(previewPlant);
    let panels = [];

    function updatePreview() {
      panels.forEach((panel) => {
        previewPlant.remove(panel);
        panel.geometry.dispose();
      });
      if (panels.length) {
        panels[0].material.map.dispose();
        panels[0].material.dispose();
      }
      panels = [];
      const material = vegetation.createMaterial(THREE, preset);
      for (let i = 0; i < 2; i++) {
        const panel = new THREE.Mesh(
          new THREE.PlaneGeometry(preset.panelWidth, preset.panelHeight),
          material
        );
        panel.rotation.y = i * Math.PI / 2;
        panel.position.y = preset.panelHeight / 2;
        previewPlant.add(panel);
        panels.push(panel);
      }
      previewPlant.rotation.y = Number(document.getElementById('rotation').value);
      const width = previewCanvas.clientWidth;
      const height = previewCanvas.clientHeight;
      renderer.setSize(width, height, false);
      previewCamera.aspect = width / height;
      previewCamera.updateProjectionMatrix();
      renderer.render(previewScene, previewCamera);
    }

    function drawGrid() {
      editor.replaceChildren();
      pixels.length = 0;
      for (let y = 0; y < HEIGHT; y++) {
        for (let x = 0; x < WIDTH; x++) {
          const cell = document.createElement('div');
          cell.className = 'pixel';
          cell.dataset.x = x;
          cell.dataset.y = y;
          editor.append(cell);
          pixels.push(cell);
          paintCell(cell, Number(preset.rows[y][x]));
        }
      }
    }

    function paintCell(cell, color) {
      const x = Number(cell.dataset.x), y = Number(cell.dataset.y);
      const row = preset.rows[y].split('');
      row[x] = String(color);
      preset.rows[y] = row.join('');
      cell.style.background = color ? preset.palette[color - 1] : '';
      cell.style.backgroundImage = color ? '' : 'repeating-conic-gradient(#aaa 0 25%, #444 0 50%)';
      cell.style.backgroundSize = color ? '' : '10px 10px';
    }

    function buildTools() {
      tools.replaceChildren();
      const transparent = document.createElement('button');
      transparent.className = 'swatch transparent';
      transparent.title = 'Transparent';
      transparent.setAttribute('aria-pressed', String(brush === 0));
      transparent.onclick = () => { brush = 0; buildTools(); };
      tools.append(transparent);
      preset.palette.forEach((color, index) => {
        const button = document.createElement('button');
        button.className = 'swatch';
        button.style.background = color;
        button.title = `Vert ${index + 1}`;
        button.setAttribute('aria-pressed', String(brush === index + 1));
        button.onclick = () => { brush = index + 1; buildTools(); };
        tools.append(button);
      });
      colorControls.replaceChildren();
      preset.palette.forEach((color, index) => {
        const row = document.createElement('label');
        row.className = 'color-row';
        row.textContent = `Vert ${index + 1}`;
        const input = document.createElement('input');
        input.type = 'color';
        input.value = color;
        input.oninput = () => {
          preset.palette[index] = input.value;
          tools.children[index + 1].style.background = input.value;
          drawGrid();
          updatePreview();
        };
        row.append(input);
        colorControls.append(row);
      });
    }

    function paintFromPointer(event) {
      const cell = document.elementFromPoint(event.clientX, event.clientY);
      if (cell && cell.classList.contains('pixel')) {
        paintCell(cell, brush);
        updatePreview();
      }
    }
    editor.addEventListener('pointerdown', (event) => { painting = true; editor.setPointerCapture(event.pointerId); paintFromPointer(event); });
    editor.addEventListener('pointermove', (event) => { if (painting) paintFromPointer(event); });
    editor.addEventListener('pointerup', () => { painting = false; });
    editor.addEventListener('pointercancel', () => { painting = false; });

    for (const [id, key] of [['panel-width', 'panelWidth'], ['panel-height', 'panelHeight']]) {
      const input = document.getElementById(id);
      const output = input.nextElementSibling;
      input.value = preset[key];
      output.value = Number(preset[key]).toFixed(2);
      input.addEventListener('input', () => {
        preset[key] = Number(input.value);
        output.value = Number(input.value).toFixed(2);
        updatePreview();
      });
    }
    const rotation = document.getElementById('rotation');
    rotation.value = 0;
    rotation.nextElementSibling.value = '0°';
    rotation.addEventListener('input', () => {
      rotation.nextElementSibling.value = `${Math.round(Number(rotation.value) * 180 / Math.PI)}°`;
      updatePreview();
    });
    document.getElementById('save').onclick = () => {
      preset = vegetation.savePreset(preset);
      document.getElementById('status').textContent = 'Herbe enregistrée. Recharge la scène pour la voir.';
    };
    document.getElementById('reset').onclick = () => {
      localStorage.removeItem('minecraft-grass-preset-v1');
      preset = vegetation.getPreset();
      drawGrid();
      buildTools();
      for (const [id, key] of [['panel-width', 'panelWidth'], ['panel-height', 'panelHeight']]) {
        const input = document.getElementById(id);
        input.value = preset[key];
        input.nextElementSibling.value = Number(preset[key]).toFixed(2);
      }
      updatePreview();
      document.getElementById('status').textContent = 'Texture par défaut restaurée.';
    };
    window.addEventListener('resize', updatePreview);
    drawGrid();
    buildTools();
    updatePreview();
  </script>
</body>
</html>
